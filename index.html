<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Obfuscator Online</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p.desc { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        .box { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        textarea {
            width: 100%;
            height: 250px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus, button:focus {
            outline: 2px solid var(--primary);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .options {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lua Obfuscator Simple</h1>
        <p class="desc">Lindungi kode skrip Lua atau Roblox Luau kamu langsung di browser.</p>
        
        <div class="grid">
            <!-- Kolom Input -->
            <div class="box">
                <label for="inputCode">Kode Lua Asli:</label>
                <textarea id="inputCode" placeholder="-- Tulis atau tempel kode Lua di sini...&#10;local pesan = 'Halo Dunia'&#10;print(pesan)"></textarea>
            </div>

            <!-- Kolom Output -->
            <div class="box">
                <label for="outputCode">Hasil Obfuscate:</label>
                <textarea id="outputCode" readonly placeholder="Hasil obfuscation akan muncul di sini..."></textarea>
            </div>

            <!-- Bagian Tombol & Pengaturan -->
            <div class="actions">
                <div class="options">
                    <label><input type="checkbox" id="removeComments" checked> Hapus Komentar</label>
                    <label><input type="checkbox" id="minifyCode" checked> Minifikasi Spasi</label>
                </div>
                <button onclick="processObfuscate()">Mulai Obfuscate</button>
            </div>
        </div>
    </div>

    <script>
        function processObfuscate() {
            let code = document.getElementById('inputCode').value;
            const removeComments = document.getElementById('removeComments').checked;
            const minifyCode = document.getElementById('minifyCode').checked;

            if (!code.trim()) {
                alert("Masukkan kode Lua terlebih dahulu!");
                return;
            }

            // 1. Logika Hapus Komentar (-- komentar)
            if (removeComments) {
                code = code.replace(/--\[\[[\s\S]*?--\]\]/g, '') // Hapus komentar blok
                           .replace(/--.*$/gm, '');              // Hapus komentar baris
            }

            // 2. Logika Sederhana Penggantian String Menjadi byte string.char(...)
            // Mengubah teks dalam tanda kutip menjadi string.char agar tidak terbaca langsung
            code = code.replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g, function(match, p1) {
                let bytes = [];
                for (let i = 0; i < p1.length; i++) {
                    bytes.push(p1.charCodeAt(i));
                }
                return 'string.char(' + bytes.join(', ') + ')';
            });

            // 3. Logika Minifikasi (Menghapus spasi berlebih & baris baru jika diaktifkan)
            if (minifyCode) {
                code = code
                    .replace(/\r?\n|\r/g, ' ') // Ganti baris baru jadi spasi
                    .replace(/\s+/g, ' ')      // Gabungkan spasi ganda
                    .trim();
            }

            // Tampilkan hasil ke textarea output
            document.getElementById('outputCode').value = code;
        }
    </script>
</body>
</html>
