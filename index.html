<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Tool - Custom Backend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #00ffcc;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #00b386;
        }
        #result {
            margin-top: 15px;
            padding: 10px;
            background: #2d2d2d;
            border-radius: 4px;
            font-size: 13px;
            word-break: break-all;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Roblox Publisher Tool</h2>
    
    <div class="form-group">
        <label for="cookie">.ROBLOSECURITY Cookie:</label>
        <textarea id="cookie" rows="3" placeholder="Masukkan cookie akun Roblox lu di sini..."></textarea>
    </div>

    <div class="form-group">
        <label for="universeId">Universe ID (Opsional, khusus untuk Create Place):</label>
        <input type="text" id="universeId" placeholder="Contoh: 12345678">
    </div>

    <button onclick="sendRequest('createUniverse')">Create Universe</button>
    <button onclick="sendRequest('createPlace')" style="background: #ff9900;">Create Place</button>

    <div id="result"></div>
</div>

<script>
    // URL Vercel Worker lu yang aktif
    const WORKER_URL = "https://worker-virid.vercel.app/api";

    async function sendRequest(action) {
        const cookie = document.getElementById('cookie').value.trim();
        const universeId = document.getElementById('universeId').value.trim();
        const resultDiv = document.getElementById('result');

        if (!cookie) {
            alert("Cookie Roblox wajib diisi!");
            return;
        }

        resultDiv.style.display = "block";
        resultDiv.style.color = "#ffff00";
        resultDiv.innerText = "Sedang memproses...";

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    action: action,
                    cookie: cookie,
                    universeId: universeId
                })
            });

            const data = await response.json();

            if (data.ok) {
                resultDiv.style.color = "#00ffcc";
                resultDiv.innerText = "SUKSES:\n" + data.message;
            } else {
                resultDiv.style.color = "#ff4444";
                resultDiv.innerText = "GAGAL:\n" + data.message;
            }
        } catch (err) {
            resultDiv.style.color = "#ff4444";
            resultDiv.innerText = "ERROR KONEKSI: " + err.message;
        }
    }
</script>

</body>
</html>
