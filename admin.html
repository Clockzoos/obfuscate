<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Script Moderation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .script-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .script-info h3 {
            margin: 0 0 10px 0;
            color: #f1f5f9;
        }
        .script-info p {
            margin: 5px 0;
            color: #cbd5e1;
            font-size: 14px;
        }
        .script-link {
            color: #38bdf8;
            text-decoration: none;
            word-break: break-all;
        }
        .script-link:hover {
            text-decoration: underline;
        }
        .action-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-allow {
            background-color: #10b981;
            color: white;
        }
        .btn-allow:hover {
            background-color: #059669;
        }
        .btn-deny {
            background-color: #ef4444;
            color: white;
        }
        .btn-deny:hover {
            background-color: #dc2626;
        }
        .no-data {
            text-align: center;
            color: #94a3b8;
            margin-top: 50px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Admin Script Moderation</h2>
        <p class="subtitle">Review script yang masuk secara Private sebelum dipublikasikan</p>

        <!-- Tempat List Script -->
        <div id="script-list">
            <p class="no-data">Memuat data dari JSONbin...</p>
        </div>
    </div>

    <script>
        // Konfigurasi Kredensial JSONBin dan Master Key
        const QUEUE_BIN_ID = "6aef24a9ac6210605a7541d0"; // Bin khusus antrean private kamu
        const PUBLIC_BIN_ID = "6aef05abac6210605a74f72a"; // Bin utama untuk website publik (index.html)
        const MASTER_KEY = "$2a$10$7kUozSyzkNytbUxnN7/kv.xInV14ItUgvNAWdjKEswZ0M.DDWgL/e";

        async function fetchScripts() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${QUEUE_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await response.json();
                
                // Mengambil data record dari JSONBin (berbentuk array langsung)
                const scripts = data.record || []; 
                
                renderScripts(scripts);
            } catch (error) {
                console.error("Gagal memuat data:", error);
                document.getElementById("script-list").innerHTML = `<p class="no-data">Gagal memuat data dari JSONbin. Periksa koneksi atau struktur JSON.</p>`;
            }
        }

        function renderScripts(scripts) {
            const listContainer = document.getElementById("script-list");
            listContainer.innerHTML = "";

            if (!Array.isArray(scripts) || scripts.length === 0) {
                listContainer.innerHTML = `<p class="no-data">Tidak ada script baru yang menunggu review. Aman! 🎉</p>`;
                return;
            }

            scripts.forEach((script, index) => {
                const card = document.createElement("div");
                card.className = "script-card";
                card.innerHTML = `
                    <div class="script-info">
                        <h3>${script.title || "Tanpa Judul"}</h3>
                        <p><strong>Link Script:</strong> <a href="${script.link || script.url}" class="script-link" target="_blank">${script.link || script.url}</a></p>
                        <p><strong>Status Saat Ini:</strong> <span style="color: #f59e0b;">Private (Menunggu Moderasi)</span></p>
                    </div>
                    <div class="action-container">
                        <button class="btn-allow" onclick="moderateScript(${index}, 'public')">Izinkan (Public)</button>
                        <button class="btn-deny" onclick="moderateScript(${index}, 'delete')">Tidak / Hapus</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Fungsi Tombol Aksi (Approve / Reject)
        async function moderateScript(index, action) {
            if(!confirm(`Apakah Anda yakin ingin ${action === 'public' ? 'mengizinkan dan mempublikasikan' : 'menghapus/menolak'} script ini?`)) return;

            try {
                // 1. Ambil data terbaru dari Queue Bin
                let qRes = await fetch(`https://api.jsonbin.io/v3/b/${QUEUE_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                let qData = await qRes.json();
                let queue = qData.record || [];

                // Ambil data script yang dipilih berdasarkan urutan (index)
                let targetScript = queue.splice(index, 1)[0]; 

                if (action === 'public') {
                    // 2A. Jika di-izinkan, masukkan ke Public Bin
                    let pRes = await fetch(`https://api.jsonbin.io/v3/b/${PUBLIC_BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': MASTER_KEY }
                    });
                    let pData = await pRes.json();
                    let publicScripts = pData.record || [];
                    if (!Array.isArray(publicScripts)) publicScripts = [];

                    // Tambahkan ke urutan paling atas daftar publik
                    publicScripts.unshift(targetScript);

                    // Update Public Bin di server
                    await fetch(`https://api.jsonbin.io/v3/b/${PUBLIC_BIN_ID}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': MASTER_KEY
                        },
                        body: JSON.stringify(publicScripts)
                    });
                }

                // 2B. Hapus data dari Queue Bin (baik di-approve maupun di-reject)
                await fetch(`https://api.jsonbin.io/v3/b/${QUEUE_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(queue)
                });

                alert(action === 'public' ? 'Script berhasil disetujui dan dipublikasikan ke web utama! 🚀' : 'Script berhasil dihapus/ditolak.');
                
                // Muat ulang daftar antrean
                fetchScripts();

            } catch (error) {
                console.error("Gagal memproses moderasi:", error);
                alert('Terjadi kesalahan saat memproses data.');
            }
        }

        // Jalankan saat halaman dibuka
        fetchScripts();
    </script>

</body>
</html>
